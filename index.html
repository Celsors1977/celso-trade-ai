<!-- SUBSTITUA APENAS ESTA PARTE NO FINAL DO SCRIPT -->

<script>

let signalLocked = false;

async function analyzeMarket(){

if(signalLocked){
return;
}

document.getElementById("loading")
.style.display = "block";

let results = [];

for(let i=0;i<pairs.length;i++){

const result =
await analyzePair(pairs[i]);

if(result){

results.push(result);

}

}

if(results.length === 0){

document.getElementById("pair")
.innerText =
"AGUARDANDO";

document.getElementById("direction")
.innerText =
"SEM SINAL";

document.getElementById("direction")
.className =
"yellow";

document.getElementById("accuracy")
.innerText =
"--%";

document.getElementById("trend")
.innerText =
"LATERAL";

document.getElementById("strength")
.innerText =
"--";

document.getElementById("risk")
.innerText =
"ALTO";

document.getElementById("marketFilter")
.innerText =
"MERCADO RUIM";

document.getElementById("rsiValue")
.innerText =
"--";

document.getElementById("volatility")
.innerText =
"--";

document.getElementById("ranking")
.innerHTML =
`
<div class="rank-item">🥇 sem sinal</div>
<div class="rank-item">🥈 sem sinal</div>
<div class="rank-item">🥉 sem sinal</div>
`;

document.getElementById("loading")
.style.display = "none";

return;

}

results.sort((a,b)=>
b.score - a.score
);

const best = results[0];

signalLocked = true;

let rankingHTML = "";

results.slice(0,3).forEach((item,index)=>{

let medal = "🥇";

if(index === 1) medal = "🥈";
if(index === 2) medal = "🥉";

rankingHTML +=
`
<div class="rank-item">
${medal}
${item.pair}
-
${item.direction}
-
${Math.floor(item.score)}%
</div>
`;

});

document.getElementById("ranking")
.innerHTML =
rankingHTML;

const probability =
Math.min(
99,
Math.floor(best.score)
);

const strength =
Math.min(
99,
Math.floor(best.score)
);

let risk;

if(best.force > 0.0015){

risk = "BAIXO";

}else if(best.force > 0.0008){

risk = "MÉDIO";

}else{

risk = "ALTO";

}

document.getElementById("pair")
.innerText =
best.pair;

document.getElementById("direction")
.innerText =
best.direction;

document.getElementById("direction")
.className =
best.direction === "CALL"
? "call"
: "put";

document.getElementById("accuracy")
.innerText =
probability + "%";

document.getElementById("trend")
.innerText =
best.trend;

document.getElementById("trend")
.className =
best.direction === "CALL"
? "green"
: "red";

document.getElementById("strength")
.innerText =
strength + "%";

document.getElementById("risk")
.innerText =
risk;

document.getElementById("risk")
.className =
risk === "BAIXO"
? "green"
: risk === "MÉDIO"
? "yellow"
: "red";

document.getElementById("rsiValue")
.innerText =
best.rsi;

document.getElementById("marketFilter")
.innerText =
best.trend;

document.getElementById("volatility")
.innerText =
best.volatility.toFixed(5);

const next =
nextM5();

document.getElementById("entry")
.innerText =
"Entrada: "
+
next.toLocaleTimeString(
"pt-BR",
{
hour:"2-digit",
minute:"2-digit"
}
);

clearInterval(timer);

timer = setInterval(()=>{

const now = new Date();

const diff = next - now;

if(diff <= 0){

document.getElementById("countdown")
.innerText =
"🚀 ENTRAR AGORA";

document.getElementById("alertText")
.style.display =
"none";

clearInterval(timer);

setTimeout(()=>{

signalLocked = false;

analyzeMarket();

},10000);

return;

}

const m =
Math.floor(diff / 1000 / 60);

const s =
Math.floor((diff / 1000) % 60);

document.getElementById("countdown")
.innerText =
String(m).padStart(2,"0")
+
":"
+
String(s).padStart(2,"0");

if(diff <= 10000){

document.getElementById("alertText")
.style.display =
"block";

}else{

document.getElementById("alertText")
.style.display =
"none";

}

},1000);

document.getElementById("loading")
.style.display = "none";

}

analyzeMarket();

setInterval(()=>{

analyzeMarket();

},15000);

</script>
