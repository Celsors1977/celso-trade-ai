<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Sinais CALL/PUT</title>
</head>
<body>

    <h2>Sistema de Sinais - CALL / PUT</h2>
    <p id="status">Aguardando dados...</p>

    <script>
        // =============================================
        // CALCULATE MACD (incluído)
        // =============================================
        function calculateMACD(closes) {
            if (!closes || closes.length < 30) {
                return { macd: 0, histogram: 0 };
            }
            // Versão simplificada para teste
            return { 
                macd: (closes[closes.length-1] - closes[closes.length-10]) * 0.001, 
                histogram: 0.0008 
            };
        }

        // =============================================
        // FUNÇÃO PRINCIPAL DE SINAL
        // =============================================
        function getTradeSignal(closes, ema9, ema21, rsi) {
            if (!closes || !ema9 || !ema21) {
                return null;
            }

            const macdData = calculateMACD(closes);

            // ==================== CALL ====================
            if (ema9 > ema21 && rsi < 60 && macdData.macd > 0) {
                return {
                    direction: "CALL",
                    trend: "ALTA",
                    strength: 68,
                    message: "✅ SINAL CALL"
                };
            }

            // ==================== PUT ====================
            if (ema9 < ema21 && rsi > 40 && macdData.macd < 0) {
                return {
                    direction: "PUT",
                    trend: "BAIXA",
                    strength: 68,
                    message: "✅ SINAL PUT"
                };
            }

            return null;
        }

        // ====================== EXEMPLO DE TESTE ======================
        console.log("✅ Script carregado com sucesso!");

        // Teste rápido (você pode apagar depois)
        let exemploCloses = [1.2345, 1.2350, 1.2348, 1.2355];
        let sinal = getTradeSignal(exemploCloses, 1.2352, 1.2340, 45);

        if (sinal) {
            document.getElementById("status").innerHTML = 
                `<strong>${sinal.message}</strong><br>Tendência: ${sinal.trend}`;
            console.log(sinal);
        }
    </script>

</body>
</html>
