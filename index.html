<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celso Ricardi Trader AI</title>
    <style>
        body {
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            margin: auto;
        }
        .card {
            background: #111;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #222;
            box-shadow: 0 0 20px rgba(0,255,153,0.05);
        }
        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #00ff99;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #00ff99;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .center {
            text-align: center;
        }
        .big {
            font-size: 60px;
            font-weight: bold;
            margin: 15px 0;
        }
        .signal {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 20px;
            margin-top: 20px;
            text-align: center;
        }
        #pair {
            font-size: 20px;
            font-weight: bold;
        }
        .call { color: #00ff99; font-size: 40px; font-weight: bold; margin: 5px 0; }
        .put { color: #ff4444; font-size: 40px; font-weight: bold; margin: 5px 0; }
        .status {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .box {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }
        .box div {
            font-size: 10px;
            color: #666;
            font-weight: bold;
            text-transform: uppercase;
        }
        .box h3 { margin: 5px 0 0 0; font-size: 15px; }
        button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            background: #00ff99;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            color: #050505;
        }
        .countdown { font-size: 48px; font-weight: bold; margin-top: 10px; }
        .market { margin-top: 20px; text-align: center; color: #555; font-size: 12px; }
        .clock { text-align: right; font-size: 14px; color: #00ff99; margin-bottom: 15px; font-weight: bold; }
        .green { color: #00ff99; }
        .red { color: #ff4444; }
        .yellow { color: gold; }
        .rsi-box, .filter-box {
            margin-top: 12px;
            background: #0a0a0a;
            padding: 12px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .rsi-box div, .filter-box div { font-size: 11px; color: #666; font-weight: bold; }
        .rsi-box h2, .filter-box h2 { margin: 0; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <div class="clock" id="clock">00:00:00</div>
    <div class="card">
        <div class="logo">Celso Ricardi</div>
        <div class="subtitle">Scanner Inteligente M5 PRO (AllOrigins Engine)</div>
        
        <div class="center">
            <div style="color: #666; font-size: 11px; font-weight: bold;">PROBABILIDADE IA</div>
            <div class="big" id="accuracy">--%</div>
        </div>
        
        <div class="signal">
            <div id="pair">AGUARDANDO</div>
            <div id="direction" class="yellow">SEM SINAL</div>
            <div id="entry" style="color: #888; font-size: 14px; margin-top: 5px;">Entrada: --</div>
            <div class="countdown green" id="countdown">🚀 SINAL DETECTADO</div>
        </div>
        
        <div class="status">
            <div class="box"><div>Tendência</div><h3 id="trend">--</h3></div>
            <div class="box"><div>Força</div><h3 id="strength">--</h3></div>
            <div class="box"><div>Risco</div><h3 id="risk">--</h3></div>
        </div>
        
        <div class="rsi-box"><div>MÉTRICA RSI (14)</div><h2 id="rsiValue">--</h2></div>
        <div class="filter-box"><div>FILTRO DE MERCADO</div><h2 id="marketFilter">--</h2></div>
        <div class="market"><span style="color: #00ff99;">●</span> Servidor ativo & monitorando M5 via Yahoo API</div>
        <button onclick="analyzeMarket()">GERAR SINAL REAL</button>
    </div>
</div>

<script>
const pairs = ["EURUSD=X", "GBPUSD=X", "USDJPY=X", "AUDUSD=X", "EURJPY=X", "GBPJPY=X", "USDCAD=X"];

function updateClock() {
    document.getElementById("clock").innerText = new Date().toLocaleTimeString("pt-BR");
}
setInterval(updateClock, 1000);

function calculateEMA(period, data) {
    const k = 2 / (period + 1);
    let ema = data[0];
    for (let i = 1; i < data.length; i++) { ema = data[i] * k + ema * (1 - k); }
    return ema;
}

function calculateRSI(data, period = 14) {
    if (data.length < period + 1) return 50;
    let gains = 0, losses = 0;
    for (let i = 1; i <= period; i++) {
        const diff = data[data.length - i] - data[data.length - i - 1];
        if (diff >= 0) gains += diff; else losses += Math.abs(diff);
    }
    if (losses === 0) return 100;
    return 100 - (100 / (1 + (gains / losses)));
}

async function analyzePair(yahooSymbol) {
    try {
        // Correção do cache do allorigins: adicionado o timestamp dinâmico no fim da URL (&_=(tempo))
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${yahooSymbol}?interval=5m&range=2d&_=${new Date().getTime()}`;
        const url = "https://api.allorigins.win/get?url=" + encodeURIComponent(targetUrl);
        
        const response = await fetch(url);
        if (!response.ok) return null;
        const wrapper = await response.json();
        if (!wrapper.contents) return null;
        
        const data = JSON.parse(wrapper.contents);
        if (!data.chart?.result?.[0]) return null;
        
        const rawCloses = data.chart.result[0].indicators.quote[0].close;
        const closes = rawCloses.filter(v => v !== null && v !== undefined);
        if (closes.length < 22) return null;

        const ema9 = calculateEMA(9, closes);
        const ema21 = calculateEMA(21, closes);
        const rsi = calculateRSI(closes);
        const last = closes[closes.length - 1];
        
        const multiplier = yahooSymbol.includes("JPY") ? 100 : 10000;
        const forceNormalized = (Math.abs(ema9 - ema21) / last) * multiplier;
        
        let direction = ema9 > ema21 ? "CALL" : "PUT";
        let trend = ema9 > ema21 ? "ALTA" : "BAIXA";
        let marketCondition = forceNormalized > 1.0 ? "TENDÊNCIA FORTE" : "ESTÁVEL";

        return {
            pair: yahooSymbol.replace("=X", "").replace(/([A-Z]{3})([A-Z]{3})/, "$1/$2"),
            direction: direction,
            trend: trend,
            forceNormalized: forceNormalized,
            rsi: Math.floor(rsi),
            marketCondition: marketCondition
        };
    } catch (e) {
        return null;
    }
}

async function analyzeMarket() {
    let results = [];
    for (let i = 0; i < pairs.length; i++) {
        const res = await analyzePair(pairs[i]);
        if (res) results.push(res);
    }

    if (results.length === 0) return;

    // Ordena pelo par com a tendência mais forte detectada no momento
    results.sort((a, b) => b.forceNormalized - a.forceNormalized);
    const best = results[0];

    const probability = Math.min(96, Math.floor(70 + (best.forceNormalized * 8)));
    const strengthScore = Math.min(99, Math.floor(40 + (best.forceNormalized * 25)));

    document.getElementById("pair").innerText = best.pair;
    document.getElementById("direction").innerText = best.direction;
    document.getElementById("direction").className = best.direction === "CALL" ? "call" : "put";
    document.getElementById("accuracy").innerText = probability + "%";
    document.getElementById("trend").innerText = best.trend;
    document.getElementById("trend").className = best.trend === "ALTA" ? "green" : "red";
    document.getElementById("strength").innerText = strengthScore + "%";
    document.getElementById("risk").innerText = "MÉDIO";
    document.getElementById("rsiValue").innerText = best.rsi + " ERP";
    document.getElementById("marketFilter").innerText = best.marketCondition;
    
    const now = new Date();
    let min = Math.ceil((now.getMinutes() + 1) / 5) * 5;
    if(min >= 60) min = 0;
    document.getElementById("entry").innerText = "Entrada Próxima: " + String(now.getHours()).padStart(2,'0') + ":" + String(min).padStart(2,'0');
}
</script>
</body>
</html>
