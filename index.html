<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trader AI M5 + M15</title>

<style>
body{
margin:0;
background:#050505;
font-family:Arial;
color:white;
}

.container{
max-width:420px;
margin:auto;
padding:20px;
}

.card{
background:#111;
border-radius:20px;
padding:20px;
border:1px solid #222;
text-align:center;
}

h1{
margin:0;
color:#00ff99;
}

.operation{
font-size:36px;
font-weight:bold;
margin:20px 0;
}

.green{color:#00ff99;}
.red{color:#ff4444;}
.gray{color:#999;}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#00ff99;
font-weight:bold;
margin-top:20px;
cursor:pointer;
}

.loading{
display:none;
margin-top:15px;
color:#00ff99;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1 id="pair">AGUARDANDO...</h1>

<div class="operation gray" id="operation">
ANALISANDO
</div>

<div id="info">
Probabilidade: --% <br>
RSI M5: -- <br>
Tendência M15: --
</div>

<button onclick="startAI()" id="btn">
ANALISAR MERCADO
</button>

<div class="loading" id="loading">
Analisando M5 + Confirmando M15...
</div>

</div>
</div>

<script>

const apiKey="65b715a09bc44070a1d6947b293281a9";

const pairs=[
"EUR/USD",
"GBP/USD",
"USD/JPY",
"AUD/USD",
"USD/CAD",
"EUR/JPY",
"GBP/JPY"
];

function calculateRSI(data,period=14){
let gains=0;
let losses=0;
for(let i=data.length-period-1;i<data.length-1;i++){
let diff=data[i+1]-data[i];
if(diff>=0){gains+=diff;}
else{losses-=diff;}
}
let avgGain=gains/period;
let avgLoss=losses/period;
if(avgLoss===0) return 100;
let rs=avgGain/avgLoss;
return 100-(100/(1+rs));
}

async function getData(symbol,interval){

const response=await fetch(
`https://api.twelvedata.com/time_series?symbol=${symbol}&interval=${interval}&outputsize=60&apikey=${apiKey}`
);

const data=await response.json();

if(!data.values) return null;

const closes=data.values.map(v=>parseFloat(v.close)).reverse();

const ma=closes.slice(-20).reduce((a,b)=>a+b,0)/20;
const lastPrice=closes[closes.length-1];

return { closes, ma, lastPrice };

}

async function analyzePair(symbol){

let m5=await getData(symbol,"5min");
let m15=await getData(symbol,"15min");

if(!m5 || !m15) return null;

let rsiM5=calculateRSI(m5.closes);

let trendM15="LATERAL";

if(m15.lastPrice > m15.ma) trendM15="ALTA";
if(m15.lastPrice < m15.ma) trendM15="BAIXA";

let operation="NÃO OPERAR";
let probability=0;
let score=0;

if(rsiM5<30 && m5.lastPrice>m5.ma && trendM15==="ALTA"){
operation="COMPRA";
probability=95;
score=95;
}

if(rsiM5>70 && m5.lastPrice<m5.ma && trendM15==="BAIXA"){
operation="VENDA";
probability=94;
score=94;
}

return{
symbol,
operation,
probability,
rsiM5,
trendM15,
score
};

}

async function startAI(){

document.getElementById("loading").style.display="block";
document.getElementById("btn").disabled=true;

let bestSignal=null;

for(let pair of pairs){

try{
let result=await analyzePair(pair);

if(result && result.score>0){
if(!bestSignal || result.score>bestSignal.score){
bestSignal=result;
}
}
}catch(e){
console.log("Erro em",pair);
}

}

if(bestSignal){

document.getElementById("pair").innerText=bestSignal.symbol;

let op=document.getElementById("operation");
op.innerText=bestSignal.operation;

if(bestSignal.operation==="COMPRA"){
op.className="operation green";
}
else{
op.className="operation red";
}

document.getElementById("info").innerHTML=
"Probabilidade: "+bestSignal.probability+"%<br>"+
"RSI M5: "+Math.floor(bestSignal.rsiM5)+"<br>"+
"Tendência M15: "+bestSignal.trendM15;

}
else{

document.getElementById("pair").innerText="SEM OPORTUNIDADE";
document.getElementById("operation").innerText="NÃO OPERAR";
document.getElementById("operation").className="operation gray";
document.getElementById("info").innerHTML=
"Sem alinhamento entre M5 e M15";

}

document.getElementById("loading").style.display="none";
document.getElementById("btn").disabled=false;

}

</script>

</body>
</html>
