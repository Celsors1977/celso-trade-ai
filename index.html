<script>

const apiKey = "65b715a09bc44070a1d6947b293281a9";

let wins = 18;
let losses = 4;
let countdownInterval;

const pairs = [
"EUR/USD",
"GBP/USD",
"USD/JPY",
"AUD/USD",
"EUR/JPY",
"GBP/JPY",
"USD/CAD"
];

function updateClock(){

const now = new Date();

document.getElementById("clock").innerText =
now.toLocaleTimeString("pt-BR");

}

setInterval(updateClock,1000);

updateClock();

function updateWinRate(){

const total = wins + losses;

const rate =
Math.floor((wins / total) * 100);

document.getElementById("winrate").innerText =
rate + "%";

}

function getNextM5Date(){

const now = new Date();

let minutes = now.getMinutes();

let nextBlock =
Math.ceil((minutes + 1) / 5) * 5;

if(nextBlock >= 60){

now.setHours(now.getHours()+1);

nextBlock = 0;

}

now.setMinutes(nextBlock);
now.setSeconds(0);

return now;

}

function startCountdown(targetDate){

clearInterval(countdownInterval);

countdownInterval = setInterval(() => {

const now = new Date();

const diff = targetDate - now;

if(diff <= 0){

document.getElementById("countdown").innerText =
"🚀 ENTRAR AGORA";

clearInterval(countdownInterval);

return;

}

const minutes =
Math.floor(diff / 1000 / 60);

const seconds =
Math.floor((diff / 1000) % 60);

document.getElementById("countdown").innerText =
String(minutes).padStart(2,"0")
+ ":" +
String(seconds).padStart(2,"0");

if(diff <= 10000){

document.getElementById("alertText").style.display =
"block";

}else{

document.getElementById("alertText").style.display =
"none";

}

},1000);

}

async function analyzePair(pair){

try{

const encodedPair =
encodeURIComponent(pair);

const url =
"https://api.twelvedata.com/time_series?symbol="
+ encodedPair +
"&interval=5min&outputsize=2&apikey="
+ apiKey;

const response = await fetch(url);

const data = await response.json();

if(!data.values){

return null;

}

const candles = data.values;

const last =
parseFloat(candles[0].close);

const previous =
parseFloat(candles[1].close);

const movement =
Math.abs(last - previous);

let action;
let trend;

if(last > previous){

action = "CALL";
trend = "ALTA";

}else{

action = "PUT";
trend = "BAIXA";

}

return{
pair: pair,
movement: movement,
action: action,
trend: trend
};

}catch(error){

console.log(error);

return null;

}

}

async function analyzeMarket(){

document.getElementById("loading").style.display =
"block";

document.getElementById("analyzeBtn").disabled =
true;

try{

let results = [];

for(let i = 0; i < pairs.length; i++){

const result =
await analyzePair(pairs[i]);

if(result){

results.push(result);

}

}

if(results.length === 0){

alert("Erro ao analisar pares");

return;

}

results.sort(function(a,b){

return b.movement - a.movement;

});

const best = results[0];

let probability =
Math.floor(Math.random()*5)+91;

let strength =
Math.floor(Math.random()*5)+95;

let risk =
best.movement > 0.001 ?
"BAIXO" :
"MÉDIO";

const entryDate = getNextM5Date();

const entryTime =
entryDate.toLocaleTimeString("pt-BR",{
hour:"2-digit",
minute:"2-digit"
});

document.getElementById("pair").innerText =
best.pair;

document.getElementById("direction").innerText =
best.action;

document.getElementById("accuracy").innerText =
probability + "%";

document.getElementById("trend").innerText =
best.trend;

document.getElementById("strength").innerText =
strength + "%";

document.getElementById("risk").innerText =
risk;

document.getElementById("entryTime").innerText =
"Entrada: " + entryTime;

if(best.action === "CALL"){

document.getElementById("direction").className =
"call green";

document.getElementById("trend").className =
"green";

}else{

document.getElementById("direction").className =
"call red";

document.getElementById("trend").className =
"red";

}

if(probability >= 90){

wins++;

}else{

losses++;

}

document.getElementById("wins").innerText =
wins;

document.getElementById("losses").innerText =
losses;

updateWinRate();

startCountdown(entryDate);

}catch(error){

console.log(error);

alert("Erro geral");

}

document.getElementById("loading").style.display =
"none";

document.getElementById("analyzeBtn").disabled =
false;

}

document.getElementById("analyzeBtn")
.addEventListener("click", analyzeMarket);

</script>
