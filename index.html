<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celso Ricardi Trader AI</title>

<style>
body{
margin:0;
background:#050505;
font-family:Arial;
color:white;
}

.container{
max-width:420px;
margin:auto;
padding:20px;
}

.logo{
font-size:26px;
font-weight:bold;
color:#00ff99;
margin-bottom:5px;
}

.subtitle{
color:#888;
margin-bottom:20px;
}

.card{
background:#111;
border-radius:20px;
padding:20px;
border:1px solid #222;
}

.accuracy{
font-size:48px;
font-weight:bold;
margin:10px 0;
}

.signal{
background:#0b0b0b;
padding:20px;
border-radius:15px;
margin-top:15px;
text-align:center;
}

.call{
font-size:32px;
font-weight:bold;
margin-top:10px;
}

.green{color:#00ff99;}
.red{color:#ff4444;}
.yellow{color:gold;}

.countdown{
margin-top:15px;
font-size:28px;
font-weight:bold;
color:#00ff99;
}

.status{
display:flex;
justify-content:space-between;
margin-top:20px;
gap:10px;
}

.mini{
background:#0a0a0a;
padding:10px;
border-radius:10px;
width:100%;
text-align:center;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#00ff99;
font-weight:bold;
margin-top:20px;
cursor:pointer;
}

.loading{
display:none;
text-align:center;
margin-top:15px;
color:#00ff99;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">Celso Ricardi Trader AI</div>
<div class="subtitle">Sistema real de análise M5</div>

<div class="card">

<div>Probabilidade</div>
<div class="accuracy" id="accuracy">--%</div>

<div class="signal">
<div id="pair">EUR/USD</div>
<div class="call yellow" id="direction">AGUARDANDO</div>
<div id="entryTime">Entrada: --:--</div>
<div class="countdown" id="countdown">00:00</div>
</div>

<div class="status">
<div class="mini">
<div>Tendência</div>
<div id="trend">--</div>
</div>
<div class="mini">
<div>RSI</div>
<div id="strength">--</div>
</div>
<div class="mini">
<div>Risco</div>
<div id="risk">--</div>
</div>
</div>

<button onclick="startAI()" id="analyzeBtn">
GERAR ANÁLISE REAL
</button>

<div class="loading" id="loading">
Analisando mercado...
</div>

</div>
</div>

<script>

let countdownInterval;

function getNextM5Date(){
const now = new Date();
let minutes = now.getMinutes();
let nextBlock = Math.ceil((minutes + 1) / 5) * 5;
if(nextBlock >= 60){
now.setHours(now.getHours() + 1);
nextBlock = 0;
}
now.setMinutes(nextBlock);
now.setSeconds(0);
return now;
}

function startCountdown(targetDate){
clearInterval(countdownInterval);

countdownInterval = setInterval(() => {
const now = new Date();
const diff = targetDate - now;

if(diff <= 0){
document.getElementById("countdown").innerText = "🚀 ENTRAR";
clearInterval(countdownInterval);
return;
}

const minutes = Math.floor(diff / 1000 / 60);
const seconds = Math.floor((diff / 1000) % 60);

document.getElementById("countdown").innerText =
String(minutes).padStart(2,'0') + ":" +
String(seconds).padStart(2,'0');

},1000);
}

async function startAI(){

document.getElementById("loading").style.display = "block";
document.getElementById("analyzeBtn").disabled = true;

const apiKey = "65b715a09bc44070a1d6947b293281a9";

try {

const response = await fetch(
`https://api.twelvedata.com/time_series?symbol=EUR/USD&interval=5min&outputsize=60&apikey=${apiKey}`
);

const data = await response.json();

if(!data.values){
alert("Erro ao buscar dados");
console.log(data);
return;
}

const closes = data.values.map(v => parseFloat(v.close)).reverse();


// Média móvel 20
const maPeriod = 20;
let ma = closes.slice(-maPeriod).reduce((a,b)=>a+b,0)/maPeriod;


// RSI 14
function calculateRSI(data, period=14){
let gains=0;
let losses=0;

for(let i=data.length-period-1;i<data.length-1;i++){
let diff=data[i+1]-data[i];
if(diff>=0){gains+=diff;}
else{losses-=diff;}
}

let avgGain=gains/period;
let avgLoss=losses/period;

if(avgLoss===0) return 100;

let rs=avgGain/avgLoss;
return 100-(100/(1+rs));
}

let rsi = calculateRSI(closes);
let lastPrice = closes[closes.length-1];

let action="AGUARDAR";
let trend="LATERAL";
let probability=75;
let risk="MÉDIO";

if(rsi<30 && lastPrice>ma){
action="CALL";
trend="ALTA";
probability=92;
risk="BAIXO";
}
else if(rsi>70 && lastPrice<ma){
action="PUT";
trend="BAIXA";
probability=91;
risk="BAIXO";
}


// Atualizar tela
document.getElementById("direction").innerText=action;
document.getElementById("accuracy").innerText=probability+"%";
document.getElementById("trend").innerText=trend;
document.getElementById("strength").innerText=Math.floor(rsi);
document.getElementById("risk").innerText=risk;

if(action==="CALL"){
document.getElementById("direction").className="call green";
}
else if(action==="PUT"){
document.getElementById("direction").className="call red";
}
else{
document.getElementById("direction").className="call yellow";
}

// horário entrada
const entryDate=getNextM5Date();
const entryTime=entryDate.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
document.getElementById("entryTime").innerText="Entrada: "+entryTime;

startCountdown(entryDate);

document.getElementById("loading").style.display="none";
document.getElementById("analyzeBtn").disabled=false;

} catch(error){
alert("Erro na conexão");
console.error(error);
}

}

</script>
</body>
</html>
