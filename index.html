<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Celso Ricardi Trader AI</title>

<style>

body{
margin:0;
background:#050505;
font-family:Arial;
color:white;
}

.container{
max-width:420px;
margin:auto;
padding:20px;
}

.logo{
font-size:28px;
font-weight:bold;
color:#00ff99;
margin-top:20px;
}

.subtitle{
color:#888;
margin-bottom:30px;
}

.card{
background:#111;
border-radius:25px;
padding:20px;
margin-bottom:20px;
border:1px solid #222;
box-shadow:0 0 20px rgba(0,255,153,0.05);
}

.accuracy{
font-size:55px;
font-weight:bold;
margin:15px 0;
}

.signal{
background:#0b0b0b;
padding:20px;
border-radius:20px;
margin-top:20px;
}

.call{
font-size:30px;
font-weight:bold;
color:#00ff99;
}

.status{
display:flex;
justify-content:space-between;
margin-top:20px;
gap:10px;
}

.mini{
background:#0a0a0a;
padding:15px;
border-radius:15px;
width:100%;
text-align:center;
}

.green{
color:#00ff99;
}

.red{
color:#ff4444;
}

.yellow{
color:gold;
}

.history{
display:flex;
justify-content:space-between;
align-items:center;
background:#0b0b0b;
padding:15px;
border-radius:15px;
margin-top:10px;
}

.win{
color:#00ff99;
font-weight:bold;
}

.loss{
color:#ff4444;
font-weight:bold;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#00ff99;
font-size:18px;
font-weight:bold;
margin-top:20px;
cursor:pointer;
transition:0.3s;
}

button:hover{
opacity:0.9;
}

.loading{
display:none;
text-align:center;
margin-top:15px;
color:#00ff99;
font-weight:bold;
animation:pulse 1s infinite;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-top:20px;
}

.stat-box{
background:#0a0a0a;
padding:15px;
border-radius:15px;
text-align:center;
}

.stat-number{
font-size:22px;
font-weight:bold;
margin-top:5px;
}

@keyframes pulse{
0%{opacity:0.3;}
50%{opacity:1;}
100%{opacity:0.3;}
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
Celso Ricardi Trader AI
</div>

<div class="subtitle">
Assistente pessoal inteligente de sinais
</div>

<div class="card">

<div>Probabilidade da IA</div>

<div class="accuracy" id="accuracy">
87%
</div>

<div class="signal">

<div>Sinal sugerido</div>

<h1 id="pair">
EUR/USD
</h1>

<div class="call" id="direction">
CALL
</div>

</div>

<div class="status">

<div class="mini">
<div>Tendência</div>
<h3 class="green" id="trend">
ALTA
</h3>
</div>

<div class="mini">
<div>Força</div>
<h3 id="strength">
94%
</h3>
</div>

<div class="mini">
<div>Risco</div>
<h3 class="yellow" id="risk">
BAIXO
</h3>
</div>

</div>

<div class="stats">

<div class="stat-box">
<div>WIN</div>
<div class="stat-number green" id="wins">
12
</div>
</div>

<div class="stat-box">
<div>LOSS</div>
<div class="stat-number red" id="losses">
3
</div>
</div>

<div class="stat-box">
<div>WIN RATE</div>
<div class="stat-number yellow" id="winrate">
80%
</div>
</div>

</div>

</div>

<div class="card">

<h2>Últimos sinais</h2>

<div id="history-list">

<div class="history">
<div>GBP/USD</div>
<div class="win">WIN</div>
</div>

<div class="history">
<div>EUR/JPY</div>
<div class="win">WIN</div>
</div>

<div class="history">
<div>AUD/USD</div>
<div class="loss">LOSS</div>
</div>

</div>

<button onclick="startAI()">
Iniciar análise IA
</button>

<div class="loading" id="loading">
🤖 IA analisando mercado...
</div>

</div>

</div>

<script>

let wins = 12;
let losses = 3;

function updateWinRate(){

const total = wins + losses;

const rate =
Math.floor((wins / total) * 100);

document.getElementById('winrate').innerText =
rate + '%';

}

function startAI(){

document.getElementById('loading').style.display =
'block';

setTimeout(() => {

const pairs = [
'EUR/USD',
'GBP/USD',
'USD/JPY',
'AUD/USD',
'EUR/JPY'
];

const trends = [
'ALTA',
'BAIXA'
];

const pair =
pairs[Math.floor(Math.random()*pairs.length)];

const trend =
trends[Math.floor(Math.random()*trends.length)];

let action;
let risk;
let probability;
let strength;

if(trend === 'ALTA'){

action = 'CALL';

probability =
Math.floor(Math.random()*10)+88;

strength =
Math.floor(Math.random()*8)+92;

risk = 'BAIXO';

document.getElementById('trend').className =
'green';

}
else{

action = 'PUT';

probability =
Math.floor(Math.random()*10)+82;

strength =
Math.floor(Math.random()*10)+80;

risk = 'MÉDIO';

document.getElementById('trend').className =
'red';

}

document.getElementById('pair').innerText = pair;

document.getElementById('direction').innerText =
action;

document.getElementById('accuracy').innerText =
probability + '%';

document.getElementById('trend').innerText =
trend;

document.getElementById('strength').innerText =
strength + '%';

document.getElementById('risk').innerText =
risk;

let result;

if(probability >= 88){

result = 'WIN';
wins++;

}
else{

result = 'LOSS';
losses++;

}

document.getElementById('wins').innerText =
wins;

document.getElementById('losses').innerText =
losses;

updateWinRate();

if(action === 'CALL'){

document.getElementById('direction').style.color =
'#00ff99';

}
else{

document.getElementById('direction').style.color =
'#ff4444';

}

const history =
document.getElementById('history-list');

const item =
document.createElement('div');

item.className = 'history';

item.innerHTML = `
<div>${pair}</div>
<div class="${result === 'WIN' ? 'win' : 'loss'}">
${result}
</div>
`;

history.prepend(item);

document.getElementById('loading').style.display =
'none';

},2000);

}

</script>

</body>
</html>
