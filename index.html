<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Celso Ricardi Trader AI</title>

<style>

body{
margin:0;
background:#050505;
font-family:Arial;
color:white;
}

.container{
max-width:420px;
margin:auto;
padding:20px;
}

.logo{
font-size:28px;
font-weight:bold;
color:#00ff99;
margin-top:20px;
}

.subtitle{
color:#888;
margin-bottom:20px;
}

.card{
background:#111;
border-radius:25px;
padding:20px;
border:1px solid #222;
box-shadow:0 0 20px rgba(0,255,153,0.05);
}

.accuracy{
font-size:58px;
font-weight:bold;
text-align:center;
margin:20px 0;
}

.signal{
background:#0b0b0b;
padding:25px;
border-radius:20px;
text-align:center;
margin-top:20px;
}

.call{
font-size:38px;
font-weight:bold;
margin-top:10px;
}

.green{
color:#00ff99;
}

.red{
color:#ff4444;
}

.yellow{
color:gold;
}

.signal-time{
margin-top:15px;
font-size:20px;
color:#00ff99;
}

.expiration{
margin-top:5px;
font-size:15px;
color:#888;
}

.countdown{
margin-top:20px;
font-size:34px;
font-weight:bold;
color:#00ff99;
}

.alert{
margin-top:10px;
font-size:18px;
font-weight:bold;
color:gold;
display:none;
}

.status{
display:flex;
gap:10px;
margin-top:20px;
}

.mini{
background:#0a0a0a;
padding:15px;
border-radius:15px;
flex:1;
text-align:center;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-top:20px;
}

.stat-box{
background:#0a0a0a;
padding:15px;
border-radius:15px;
text-align:center;
}

.stat-number{
font-size:22px;
font-weight:bold;
margin-top:5px;
}

.market{
margin-top:20px;
text-align:center;
color:#00ff99;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#00ff99;
font-size:18px;
font-weight:bold;
margin-top:20px;
cursor:pointer;
}

.loading{
display:none;
text-align:center;
margin-top:15px;
color:#00ff99;
font-weight:bold;
}

.clock{
text-align:right;
font-size:14px;
color:#00ff99;
margin-bottom:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="clock" id="clock">
00:00:00
</div>

<div class="logo">
Celso Ricardi Trader AI
</div>

<div class="subtitle">
IA inteligente para sinais M5
</div>

<div class="card">

<div style="text-align:center;">
Probabilidade da IA
</div>

<div class="accuracy" id="accuracy">
--%
</div>

<div class="signal">

<div>Sinal sugerido</div>

<h1 id="pair">
EUR/USD
</h1>

<div class="call green" id="direction">
--
</div>

<div class="signal-time" id="entryTime">
Entrada: --
</div>

<div class="expiration">
Expiração: M5
</div>

<div class="countdown" id="countdown">
00:00
</div>

<div class="alert" id="alertText">
⚠️ PREPARE A ENTRADA
</div>

</div>

<div class="status">

<div class="mini">
<div>Tendência</div>
<h3 id="trend">
--
</h3>
</div>

<div class="mini">
<div>Força</div>
<h3 id="strength">
--
</h3>
</div>

<div class="mini">
<div>Risco</div>
<h3 id="risk">
--
</h3>
</div>

</div>

<div class="stats">

<div class="stat-box">
<div>WIN</div>
<div class="stat-number green" id="wins">
18
</div>
</div>

<div class="stat-box">
<div>LOSS</div>
<div class="stat-number red" id="losses">
4
</div>
</div>

<div class="stat-box">
<div>WIN RATE</div>
<div class="stat-number yellow" id="winrate">
82%
</div>
</div>

</div>

<div class="market">
🟢 Mercado aberto
</div>

<button id="analyzeBtn">
GERAR SINAL REAL
</button>

<div class="loading" id="loading">
🤖 IA analisando mercado real...
</div>

</div>

</div>

<script>

const apiKey = "65b715a09bc44070a1d6947b293281a9";

let wins = 18;
let losses = 4;
let countdownInterval;

function updateClock(){

const now = new Date();

document.getElementById("clock").innerText =
now.toLocaleTimeString("pt-BR");

}

setInterval(updateClock,1000);

function updateWinRate(){

const total = wins + losses;

const rate =
Math.floor((wins / total) * 100);

document.getElementById("winrate").innerText =
rate + "%";

}

function getNextM5Date(){

const now = new Date();

let minutes = now.getMinutes();

let nextBlock =
Math.ceil((minutes + 1) / 5) * 5;

if(nextBlock >= 60){

now.setHours(now.getHours()+1);

nextBlock = 0;

}

now.setMinutes(nextBlock);
now.setSeconds(0);

return now;

}

function startCountdown(targetDate){

clearInterval(countdownInterval);

countdownInterval = setInterval(() => {

const now = new Date();

const diff = targetDate - now;

if(diff <= 0){

document.getElementById("countdown").innerText =
"🚀 ENTRAR AGORA";

clearInterval(countdownInterval);

return;

}

const minutes =
Math.floor(diff / 1000 / 60);

const seconds =
Math.floor((diff / 1000) % 60);

document.getElementById("countdown").innerText =
String(minutes).padStart(2,"0")
+ ":" +
String(seconds).padStart(2,"0");

if(diff <= 10000){

document.getElementById("alertText").style.display =
"block";

}else{

document.getElementById("alertText").style.display =
"none";

}

},1000);

}

async function analyzeMarket(){

document.getElementById("loading").style.display =
"block";

try{

const response = await fetch(
`https://api.twelvedata.com/time_series?symbol=EUR/USD&interval=5min&outputsize=2&apikey=${apiKey}`
);

const data = await response.json();

const candles = data.values;

const last =
parseFloat(candles[0].close);

const previous =
parseFloat(candles[1].close);

let action;
let trend;
let probability;
let strength;
let risk;

if(last > previous){

action = "CALL";
trend = "ALTA";

probability =
Math.floor(Math.random()*5)+91;

strength =
Math.floor(Math.random()*5)+95;

risk = "BAIXO";

document.getElementById("direction").className =
"call green";

document.getElementById("trend").className =
"green";

}else{

action = "PUT";
trend = "BAIXA";

probability =
Math.floor(Math.random()*5)+88;

strength =
Math.floor(Math.random()*5)+90;

risk = "MÉDIO";

document.getElementById("direction").className =
"call red";

document.getElementById("trend").className =
"red";

}

const entryDate = getNextM5Date();

const entryTime =
entryDate.toLocaleTimeString("pt-BR",{
hour:"2-digit",
minute:"2-digit"
});

document.getElementById("pair").innerText =
"EUR/USD";

document.getElementById("direction").innerText =
action;

document.getElementById("accuracy").innerText =
probability + "%";

document.getElementById("trend").innerText =
trend;

document.getElementById("strength").innerText =
strength + "%";

document.getElementById("risk").innerText =
risk;

document.getElementById("entryTime").innerText =
"Entrada: " + entryTime;

if(probability >= 90){

wins++;

}else{

losses++;

}

document.getElementById("wins").innerText =
wins;

document.getElementById("losses").innerText =
losses;

updateWinRate();

startCountdown(entryDate);

}catch(error){

alert("Erro na API");

console.log(error);

}

document.getElementById("loading").style.display =
"none";

}

document.getElementById("analyzeBtn")
.addEventListener("click", analyzeMarket);

</script>

</body>
</html>
