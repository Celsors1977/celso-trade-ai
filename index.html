<body>

<div class="container">

<div class="clock" id="clock">
00:00:00
</div>

<div class="card">

<div class="logo">
Celso Ricardi Trader
</div>

<div class="subtitle">
STO MTF + ATR + ADX
</div>

<div class="center">

<div style="font-size:9px;color:#666;font-weight:bold;">
PROBABILIDADE IA
</div>

<div class="big" id="accuracy">
--%
</div>

<div class="market">
🟢 AUTO SCANNER PREMIUM
</div>

</div>

<div class="signal">

<div id="pair">
AGUARDANDO
</div>

<div id="direction" class="yellow">
SEM SINAL
</div>

<div class="entry" id="entry">
Entrada: --
</div>

<div class="countdown" id="countdown">
⌛ ANALISANDO
</div>

</div>

<div class="premium" id="premiumStatus">
⚠️ AGUARDANDO CONFLUÊNCIA
</div>

<div class="status">

<div class="box">
<div>TENDÊNCIA</div>
<h3 id="trend">--</h3>
</div>

<div class="box">
<div>FORÇA</div>

</div>

<div class="indicator">
<div>M1</div>
<h2 id="sto1">🟡</h2>
</div>

<div class="indicator">
<div>M5</div>
<h2 id="sto5">🟡</h2>
</div>

<div class="indicator">
<div>M15</div>
<h2 id="sto15">🟡</h2>
</div>

<div class="indicator">
<div>ATR</div>
<h2 id="atr">🟡</h2>
</div>

<div class="indicator">
<div>ADX</div>
<h2 id="adx">🟡</h2>
</div>

<div>STATUS</div>
<h2 id="statusSignal">⌛</h2>
</div>

<div class="buttons">

<button class="btn-update" onclick="autoScan()">

</button>

ENTRAR

Sistema iniciado.
</div>

<script>

const pairs = [

"EURUSD=X",
"GBPUSD=X",
"USDJPY=X",
"AUDUSD=X",
"NZDUSD=X",
"USDCAD=X",
"USDCHF=X",

"EURJPY=X",
"GBPJPY=X",
"AUDJPY=X",
"CADJPY=X",
"CHFJPY=X",
"NZDJPY=X",

"EURGBP=X",
"EURAUD=X",
"EURNZD=X",
"EURCAD=X",
"EURCHF=X",

"GBPAUD=X",
"GBPCAD=X",
"GBPCHF=X",
"GBPNZD=X",

"AUDCAD=X",
"AUDCHF=X",
"AUDNZD=X",

"NZDCAD=X",
"NZDCHF=X",

"CADCHF=X",

"EURSEK=X",
"EURNOK=X",

"USDNOK=X",
"USDSEK=X",

"SGDJPY=X",
"HKDJPY=X",

"CHFSGD=X",

"AUDSGD=X",

"EURSGD=X",

"GBPSGD=X",

"USDSGD=X",

"CADSGD=X"

];

function updateClock(){

document.getElementById("clock")
.innerText =
new Date().toLocaleTimeString("pt-BR");

}

setInterval(updateClock,1000);

function stochastic(data){

const low =
Math.min(...data.slice(-14));

const high =
Math.max(...data.slice(-14));

const last =
data[data.length-1];

return ((last-low)/(high-low))*100;

}

function ATR(data){

let total = 0;

for(let i=1;i<14;i++){

total += Math.abs(
data[data.length-i]
-
data[data.length-i-1]
);

}

return total/14;

}

function EMA(period,data){

const k = 2/(period+1);

let ema = data[0];

for(let i=1;i<data.length;i++){

ema = data[i]*k + ema*(1-k);

}

return ema;

}

function nextM5(){

const now = new Date();

let next =
Math.ceil((now.getMinutes()+1)/5)*5;

if(next >= 60){

now.setHours(now.getHours()+1);

next = 0;

}

now.setMinutes(next);
now.setSeconds(0);

return now;

}

async function analyzePair(symbol){

try{

const targetUrl =
`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=5m&range=2d&_=${Date.now()}`;

const url =
"https://api.allorigins.win/get?url="
+
encodeURIComponent(targetUrl);

const response =
await fetch(url);

const wrapper =
await response.json();

const data =
JSON.parse(wrapper.contents);

const closes =
data.chart.result[0]
.indicators.quote[0].close
.filter(v => v !== null);

if(closes.length < 40){

return null;

}

const stoM1 =
stochastic(closes.slice(-15));

const stoM5 =
stochastic(closes.slice(-25));

const stoM15 =
stochastic(closes.slice(-35));

const bullish =
stoM1 > 60 &&
stoM5 > 60 &&
stoM15 > 60;

const bearish =
stoM1 < 40 &&
stoM5 < 40 &&
stoM15 < 40;

const atr =
ATR(closes);

const ema9 = EMA(9,closes);
const ema21 = EMA(21,closes);

const adx =
Math.abs(ema9-ema21)*10000;

if(!(bullish || bearish)){

return null;

}

if(atr < 0.0005){

return null;

}

if(adx < 2){

return null;

}

let direction =
bullish
? "CALL"
: "PUT";

let trend =
bullish
? "ALTA"
: "BAIXA";

let score =
Math.floor(85 + (adx*2));

if(score > 99){

score = 99;

}

return{

pair:
symbol.replace("=X","")
.replace(
/([A-Z]{3})([A-Z]{3})/,
"$1/$2"
),

direction,
trend,
score,
atr,
adx,
bullish

};

}catch(e){

return null;

}

}

async function autoScan(){

document.getElementById("loading")
.innerText =
"🔎 Escaneando mercado...";

document.getElementById("enterBtn")
.style.display = "none";

let results = [];

for(let i=0;i<pairs.length;i++){

const result =
await analyzePair(pairs[i]);

if(result){

results.push(result);

}

await new Promise(r=>setTimeout(r,120));

}

if(results.length === 0){

document.getElementById("premiumStatus")
.innerHTML =
"⚠️ SEM CONFLUÊNCIA";

document.getElementById("countdown")
.innerText =
"⌛ AGUARDANDO";

document.getElementById("statusSignal")
.innerText =
"❌";

return;

}

results.sort((a,b)=>b.score-a.score);

const best = results[0];

document.getElementById("pair")
.innerText =
best.pair;

document.getElementById("direction")
.innerText =
best.direction;

document.getElementById("direction")
.className =
best.direction === "CALL"
? "call"
: "put";

document.getElementById("accuracy")
.innerText =
best.score + "%";

document.getElementById("trend")
.innerText =
best.trend;

document.getElementById("strength")
.innerText =
best.score + "%";

document.getElementById("risk")
.innerText =
"BAIXO";

document.getElementById("sto1")
.innerText =
best.bullish
? "🟢"
: "🔴";

document.getElementById("sto5")
.innerText =
best.bullish
? "🟢"
: "🔴";

document.getElementById("sto15")
.innerText =
best.bullish
? "🟢"
: "🔴";

document.getElementById("atr")
.innerText =
best.atr > 0.0005
? "🟢"
: "🔴";

document.getElementById("adx")
.innerText =
best.adx > 2
? "🟢"
: "🔴";

document.getElementById("statusSignal")
.innerText =
"🔥";

document.getElementById("premiumStatus")
.innerHTML =
"🔥 ENTRADA PREMIUM";

const next = nextM5();

document.getElementById("entry")
.innerText =
"Entrada: "
+
next.toLocaleTimeString(
"pt-BR",
{
hour:"2-digit",
minute:"2-digit"
}
);

startCountdown(next);

}

function startCountdown(target){

const timer =
setInterval(()=>{

const now = new Date();

const diff =
target - now;

if(diff <= 0){

document.getElementById("countdown")
.innerText =
"🚀 ENTRAR";

document.getElementById("enterBtn")
.style.display = "block";

clearInterval(timer);

return;

}

const totalSec =
Math.floor(diff/1000);

if(totalSec <= 10){

document.getElementById("enterBtn")
.style.display = "block";

}

const min =
Math.floor(diff/1000/60);

const sec =
Math.floor((diff/1000)%60);

document.getElementById("countdown")
.innerText =
String(min).padStart(2,"0")
+
":"
+
String(sec).padStart(2,"0");

},1000);

}

autoScan();

setInterval(()=>{

if(
document.getElementById("countdown")
.innerText === "⌛ AGUARDANDO"
){

autoScan();

}

},20000);

</script>

</body>

</html>
