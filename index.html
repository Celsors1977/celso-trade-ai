<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trader AI</title>

<style>
body{
margin:0;
background:#050505;
font-family:Arial;
color:white;
}

.container{
max-width:420px;
margin:auto;
padding:20px;
}

.card{
background:#111;
border-radius:20px;
padding:20px;
border:1px solid #222;
text-align:center;
}

h1{
margin:0;
color:#00ff99;
}

.operation{
font-size:40px;
font-weight:bold;
margin:20px 0;
}

.green{color:#00ff99;}
.red{color:#ff4444;}
.gray{color:#999;}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#00ff99;
font-weight:bold;
margin-top:20px;
cursor:pointer;
}

.loading{
display:none;
margin-top:15px;
color:#00ff99;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>EUR/USD</h1>

<div class="operation gray" id="operation">
AGUARDANDO
</div>

<div id="info">
Probabilidade: --% <br>
RSI: -- <br>
Tendência: --
</div>

<button onclick="startAI()" id="btn">
GERAR SINAL
</button>

<div class="loading" id="loading">
Analisando mercado...
</div>

</div>
</div>

<script>

async function startAI(){

document.getElementById("loading").style.display="block";
document.getElementById("btn").disabled=true;

const apiKey="65b715a09bc44070a1d6947b293281a9";

try{

const response=await fetch(
`https://api.twelvedata.com/time_series?symbol=EUR/USD&interval=5min&outputsize=60&apikey=${apiKey}`
);

const data=await response.json();

if(!data.values){
alert("Erro ao buscar dados");
return;
}

const closes=data.values.map(v=>parseFloat(v.close)).reverse();

const maPeriod=20;
let ma=closes.slice(-maPeriod).reduce((a,b)=>a+b,0)/maPeriod;

function calculateRSI(data,period=14){
let gains=0;
let losses=0;
for(let i=data.length-period-1;i<data.length-1;i++){
let diff=data[i+1]-data[i];
if(diff>=0){gains+=diff;}
else{losses-=diff;}
}
let avgGain=gains/period;
let avgLoss=losses/period;
if(avgLoss===0) return 100;
let rs=avgGain/avgLoss;
return 100-(100/(1+rs));
}

let rsi=calculateRSI(closes);
let lastPrice=closes[closes.length-1];

let operation="NÃO OPERAR";
let probability=75;
let trend="LATERAL";
let color="gray";

if(rsi<30 && lastPrice>ma){
operation="COMPRA";
probability=92;
trend="ALTA";
color="green";
}
else if(rsi>70 && lastPrice<ma){
operation="VENDA";
probability=91;
trend="BAIXA";
color="red";
}

let op=document.getElementById("operation");
op.innerText=operation;
op.className="operation "+color;

document.getElementById("info").innerHTML=
"Probabilidade: "+probability+"%<br>"+
"RSI: "+Math.floor(rsi)+"<br>"+
"Tendência: "+trend;

document.getElementById("loading").style.display="none";
document.getElementById("btn").disabled=false;

}catch(error){
alert("Erro na conexão");
}

}

</script>

</body>
</html>
