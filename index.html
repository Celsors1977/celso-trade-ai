<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celso Ricardi Trader AI v2</title>

<style>
body{background:#050505;color:#fff;font-family:Arial;margin:0;padding:20px;}
.container{max-width:450px;margin:auto;}
.card{background:#111;padding:20px;border-radius:20px;border:1px solid #222;}
.logo{font-size:26px;color:#00ff99;font-weight:bold;}
.subtitle{color:#888;margin-bottom:15px;}
button{width:100%;padding:15px;border:none;border-radius:12px;background:#00ff99;font-weight:bold;cursor:pointer;}
.big{font-size:50px;text-align:center;margin:15px 0;}
.signal{background:#0a0a0a;padding:15px;border-radius:15px;text-align:center;margin-top:15px;}
.call{color:#00ff99;font-size:35px;font-weight:bold;}
.put{color:#ff4444;font-size:35px;font-weight:bold;}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px;}
.box{background:#0a0a0a;padding:12px;border-radius:12px;text-align:center;}
.history{margin-top:15px;background:#0a0a0a;padding:10px;border-radius:12px;}
.item{padding:6px;border-bottom:1px solid #222;font-size:13px;}
.loading{display:none;color:#00ff99;text-align:center;margin-top:10px;}
.clock{text-align:right;color:#00ff99;font-size:13px;}
</style>

</head>
<body>

<div class="container">
<div class="clock" id="clock"></div>

<div class="card">
<div class="logo">Trader AI v2</div>
<div class="subtitle">MACD + EMA + RSI PRO</div>

<button onclick="runAnalysis()">ATUALIZAR AGORA</button>
<div class="loading" id="loading">Analisando mercado...</div>

<div class="big" id="score">--%</div>

<div class="signal">
<div id="pair">--</div>
<div id="direction">SEM SINAL</div>
<div id="entry">Entrada: --</div>
<div id="timer">--:--</div>
</div>

<div class="boxes">
<div class="box">Tendência<br><b id="trend">--</b></div>
<div class="box">RSI<br><b id="rsi">--</b></div>
<div class="box">MACD<br><b id="macd">--</b></div>
<div class="box">Volatilidade<br><b id="vol">--</b></div>
</div>

<div class="history" id="history"></div>

</div>
</div>

<script>

const apiKey = "SUA_API_AQUI";

const pairs = [
"EUR/USD","GBP/USD","USD/JPY","AUD/USD",
"USD/CAD","EUR/JPY","GBP/JPY","NZD/USD"
];

let lock = false;

// ================= CLOCK =================
setInterval(()=>{
document.getElementById("clock").innerText = new Date().toLocaleTimeString();
},1000);

// ================= EMA =================
function EMA(data, period){
let k = 2/(period+1);
let ema = data[0];
for(let i=1;i<data.length;i++){
ema = data[i]*k + ema*(1-k);
}
return ema;
}

// ================= RSI =================
function RSI(data){
let gain=0,loss=0;
for(let i=1;i<data.length;i++){
let diff=data[i]-data[i-1];
if(diff>0)gain+=diff; else loss+=Math.abs(diff);
}
let rs = gain/(loss||1);
return 100-(100/(1+rs));
}

// ================= MACD REAL =================
function MACD(data){
let ema12 = EMA(data.slice(-12),12);
let ema26 = EMA(data.slice(-26),26);
let line = ema12-ema26;
return line;
}

// ================= VOLATILITY =================
function VOL(data){
let sum=0;
for(let i=1;i<data.length;i++){
sum+=Math.abs(data[i]-data[i-1]);
}
return sum/data.length;
}

// ================= ANALYZE ONE PAIR =================
async function analyze(pair){

let url = `https://api.twelvedata.com/time_series?symbol=${pair}&interval=5min&outputsize=60&apikey=${apiKey}`;

let res = await fetch(url);
let json = await res.json();
if(!json.values) return null;

let data = json.values.map(x=>parseFloat(x.close)).reverse();

let ema9 = EMA(data.slice(-20),9);
let ema21 = EMA(data.slice(-30),21);
let macd = MACD(data);
let rsi = RSI(data);
let vol = VOL(data);

// SCORE
let score = (Math.abs(macd)*10000) + (vol*50000);

let direction = null;

if(ema9>ema21 && macd>0 && rsi<65){
direction="CALL";
}
else if(ema9<ema21 && macd<0 && rsi>35){
direction="PUT";
}
else return null;

return {pair,direction,macd,rsi,vol,score};
}

// ================= MAIN =================
async function runAnalysis(){

if(lock) return;
lock=true;

document.getElementById("loading").style.display="block";

let results = await Promise.all(pairs.map(analyze));
results = results.filter(r=>r);

if(results.length==0){
lock=false;
document.getElementById("loading").style.display="none";
return;
}

results.sort((a,b)=>b.score-a.score);
let best = results[0];

document.getElementById("pair").innerText=best.pair;
document.getElementById("direction").innerText=best.direction;
document.getElementById("direction").className=
best.direction=="CALL"?"call":"put";

document.getElementById("score").innerText=Math.min(98,Math.floor(best.score/1000))+"%";
document.getElementById("trend").innerText=best.direction;
document.getElementById("rsi").innerText=best.rsi.toFixed(1);
document.getElementById("macd").innerText=best.macd.toFixed(5);
document.getElementById("vol").innerText=best.vol.toFixed(5);

let next = new Date();
next.setMinutes(Math.ceil(next.getMinutes()/5)*5);
next.setSeconds(0);

document.getElementById("entry").innerText=
"Entrada: "+next.toLocaleTimeString().slice(0,5);

startTimer(next);

addHistory(best);

document.getElementById("loading").style.display="none";
lock=false;
}

// ================= TIMER =================
function startTimer(target){
setInterval(()=>{
let diff = target - new Date();
if(diff<=0){
document.getElementById("timer").innerText="ENTRAR AGORA";
return;
}
let m=Math.floor(diff/60000);
let s=Math.floor((diff%60000)/1000);
document.getElementById("timer").innerText=
`${m}:${s.toString().padStart(2,"0")}`;
},1000);
}

// ================= HISTORY =================
function addHistory(b){
let div=document.createElement("div");
div.className="item";
div.innerText=`${b.pair} ${b.direction} | RSI ${b.rsi.toFixed(1)}`;
document.getElementById("history").prepend(div);
}

runAnalysis();
setInterval(()=>{if(!lock)runAnalysis();},60000);

</script>

</body>
</html>
