<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Estudos - Indicadores</title>

<style>
body{
background:#050505;
color:white;
font-family:Arial;
margin:0;
padding:10px;
}

.container{
max-width:400px;
margin:auto;
}

.card{
background:#111;
padding:15px;
border-radius:15px;
border:1px solid #222;
}

.logo{
font-size:22px;
font-weight:bold;
color:#00ff99;
}

.clock{
text-align:right;
color:#00ff99;
font-size:12px;
}

.big{
font-size:48px;
text-align:center;
color:#00ff99;
font-weight:bold;
margin:10px 0;
}

.signal{
background:#0a0a0a;
padding:15px;
border-radius:12px;
text-align:center;
margin-top:10px;
}

.status{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-top:10px;
}

.box{
background:#0a0a0a;
padding:10px;
border-radius:10px;
text-align:center;
}

.indicators{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px;
}

.ind{
background:#0a0a0a;
padding:10px;
border-radius:10px;
text-align:center;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#00ff99;
font-weight:bold;
cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

<div class="clock" id="clock">00:00:00</div>

<div class="card">

<div class="logo">Painel de Estudos</div>

<div class="big" id="score">--</div>

<div class="signal">
<h2 id="pair">AGUARDANDO</h2>
<div id="status">SEM DADOS</div>
<div id="timer">00:00</div>
</div>

<div class="status">
<div class="box">
<div>TENDÊNCIA</div>
<h3 id="trend">--</h3>
</div>

<div class="box">
<div>FORÇA</div>
<h3 id="strength">--</h3>
</div>

<div class="box">
<div>RISCO</div>
<h3 id="risk">--</h3>
</div>
</div>

<div class="indicators">

<div class="ind">
<div>RSI</div>
<h2 id="rsi">--</h2>
</div>

<div class="ind">
<div>EMA</div>
<h2 id="ema">--</h2>
</div>

<div class="ind">
<div>ATR</div>
<h2 id="atr">--</h2>
</div>

<div class="ind">
<div>ESTOC.</div>
<h2 id="sto">--</h2>
</div>

</div>

<button onclick="scan()">ATUALIZAR</button>

</div>

</div>

<script>

function updateClock(){
document.getElementById("clock").innerText =
new Date().toLocaleTimeString("pt-BR");
}

setInterval(updateClock,1000);

function random(min,max){
return (Math.random()*(max-min)+min).toFixed(2);
}

function scan(){

document.getElementById("pair").innerText =
"EUR/USD";

document.getElementById("score").innerText =
Math.floor(Math.random()*30+70) + "/100";

document.getElementById("trend").innerText =
Math.random()>0.5 ? "ALTA" : "BAIXA";

document.getElementById("strength").innerText =
random(50,100)+"%";

document.getElementById("risk").innerText =
Math.random()>0.5 ? "BAIXO" : "MÉDIO";

document.getElementById("rsi").innerText =
random(20,80);

document.getElementById("ema").innerText =
random(1.0000,1.5000);

document.getElementById("atr").innerText =
random(0.0001,0.0020);

document.getElementById("sto").innerText =
random(0,100);

document.getElementById("status").innerText =
"INDICADORES ATUALIZADOS";

startTimer();
}

function startTimer(){

let sec = 300;

const timer = setInterval(()=>{

let m = Math.floor(sec/60);
let s = sec%60;

document.getElementById("timer").innerText =
String(m).padStart(2,"0")
+
":"
+
String(s).padStart(2,"0");

sec--;

if(sec < 0){
clearInterval(timer);
}

},1000);

}

scan();

</script>

</body>
</html>
