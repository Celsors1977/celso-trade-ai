<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celso Trade AI</title>

  <style>
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:#050505;
      color:white;
    }

    .container{
      max-width:420px;
      margin:auto;
      padding:20px;
    }

    .logo{
      color:#00ff99;
      font-size:32px;
      font-weight:bold;
      margin-top:20px;
    }

    .subtitle{
      color:#999;
      margin-bottom:30px;
    }

    .card{
      background:#111;
      border:1px solid #222;
      border-radius:25px;
      padding:20px;
      margin-bottom:20px;
      box-shadow:0 0 20px rgba(0,255,153,0.08);
    }

    .accuracy{
      font-size:55px;
      font-weight:bold;
      margin:10px 0;
    }

    .signal{
      background:#0d0d0d;
      border-radius:20px;
      padding:20px;
      margin-top:20px;
    }

    .call{
      color:#00ff99;
      font-weight:bold;
      font-size:28px;
    }

    .status{
      display:flex;
      justify-content:space-between;
      margin-top:15px;
    }

    .mini{
      background:#0c0c0c;
      border-radius:15px;
      padding:12px;
      width:30%;
      text-align:center;
    }

    .green{
      color:#00ff99;
    }

    .yellow{
      color:gold;
    }

    .history{
      display:flex;
      justify-content:space-between;
      background:#0a0a0a;
      padding:15px;
      border-radius:15px;
      margin-top:10px;
    }

    .win{
      color:#00ff99;
      font-weight:bold;
    }

    button{
      width:100%;
      border:none;
      background:#00ff99;
      color:black;
      padding:18px;
      border-radius:18px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      margin-top:20px;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="logo">Celso Trade AI</div>
  <div class="subtitle">Assistente pessoal de sinais com IA</div>

  <div class="card">

    <div>Probabilidade da IA</div>
    <div class="accuracy">84%</div>

    <div class="signal">

      <div>Sinal sugerido</div>

      <h1>EUR/USD</h1>

      <div class="call">CALL</div>

    </div>

    <div class="status">

      <div class="mini">
        <div>Tendência</div>
        <h3 class="green">ALTA</h3>
      </div>

      <div class="mini">
        <div>Força</div>
        <h3>92%</h3>
      </div>

      <div class="mini">
        <div>Risco</div>
        <h3 class="yellow">BAIXO</h3>
      </div>

    </div>

  </div>

  <div class="card">

    <h2>Histórico</h2>

    <div class="history">
      <div>GBP/USD</div>
      <div class="win">WIN</div>
    </div>

    <div class="history">
      <div>EUR/JPY</div>
      <div class="win">WIN</div>
    </div>

    <div class="history">
      <div>AUD/USD</div>
      <div class="win">WIN</div>
    </div>

    <button>Iniciar análise IA</button>

  </div>

</div>

</body>
</html>
